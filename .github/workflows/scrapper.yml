name: Construction Job Scraper - Every Hour

on:
  schedule:
    - cron: '0 * * * *'   # Runs at the top of every hour
  workflow_dispatch:      # Allows manual runs from GitHub Actions

concurrency:
  group: construction-job-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run construction job scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_scraper.py

      - name: Commit and push updated files
        shell: bash
        run: |
          git config --global user.name "Job Scraper Bot"
          git config --global user.email "bot@github.com"

          # Stage all generated/modified files.
          git add -A

          # Stop successfully if scraper produced no repository changes.
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Construction job update - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Bring in any remote changes before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
